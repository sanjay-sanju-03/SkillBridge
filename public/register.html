<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="form-box auth-box"><h2>Create your account</h2><p class="form-subtitle">Join SkillBridge+ and discover new opportunities.</p><form id="registerForm"><label>Name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><button class="button full-width">Register</button></form><p id="message" class="form-message"></p><p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p></div><script src="js/auth.js"></script></body>
</html>
